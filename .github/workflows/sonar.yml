name: Build, Test & Deploy

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

env:
  DOTNET_VERSION: '8.0.x'
  SONAR_PROJECT_KEY: advanceddevsample_advanceddevsample
  SONAR_ORGANIZATION: advanceddevsample

jobs:
  # ===========================================
  # JOB 1: Build
  # ===========================================
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore

  # ===========================================
  # JOB 2: Test + SonarCloud
  # ===========================================
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore
      - run: dotnet test --configuration Release --collect:"XPlat Code Coverage"

      # SonarCloud analysis
      - uses: SonarSource/sonarqube-scan-action@v5
        continue-on-error: true
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ===========================================
  # JOB 3: Deploy (API + Documentation)
  # ===========================================
  deploy:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      # --- Deploy API ---
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet publish AdvancedDevSample.Api/AdvancedDevSample.Api.csproj --configuration Release --output ./publish

      # --- Build & Deploy Documentation ---
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4
